name = "ironpear-explorer-api"
main = "src/worker.ts"
compatibility_date = "2026-08-18"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[vars]
IRONPEAR_RPC_ENDPOINT = "https://rpc-stn.ironpear.org"
INDEX_BATCH_LIMIT = "10"

[[d1_databases]]
binding = "DB"
database_name = "ironpear_explorer"
database_id = "24ecd5f8-fd4b-4b88-9c80-92c6c9fee5c1"
migrations_dir = "migrations"

[triggers]
crons = ["* * * * *"]

[[routes]]
pattern = "api-explorer.ironpear.org"
custom_domain = true
