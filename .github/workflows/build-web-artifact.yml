name: Build IronPear Explorer Web Artifact

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: true
        default: 9a4303f

permissions:
  contents: read

jobs:
  build-web:
    name: Build frontend artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build web
        run: npm run build -w @ironpear-explorer/web
        env:
          VITE_EXPLORER_API_BASE: https://api-explorer.ironpear.org

      - name: Verify faucet-address search fix
        run: |
          grep -F '<button type="submit">Search</button>' apps/web/src/main.tsx
          grep -F 'min-width: 0;' apps/web/src/styles.css
          grep -R -F 'https://api-explorer.ironpear.org' apps/web/dist

      - name: Upload static frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: ironpear-explorer-web-dist-${{ inputs.ref }}
          path: apps/web/dist
          if-no-files-found: error
